[package]
name = "ripple"
version = "0.2.0"
edition = "2024"
description = "Monorepo change detection: which modules changed for a given git diff"
license = "MIT"
homepage = "https://github.com/charlesbthomas/ripple"
repository = "https://github.com/charlesbthomas/ripple"

[dependencies]
anstream = "0.6"
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
glob = "0.3.4"
globset = "0.4"
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = true
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
