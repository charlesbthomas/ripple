name: Setup ripple
description: Install the ripple CLI (monorepo change detection) on Linux and macOS runners
branding:
  icon: droplet
  color: blue

inputs:
  version:
    description: Release to install, e.g. "0.1.0" or "v0.1.0", or "latest"
    required: false
    default: latest

runs:
  using: composite
  steps:
    - name: Install ripple
      shell: bash
      env:
        RIPPLE_VERSION: ${{ inputs.version }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/install.sh"
