base_url = "https://charlesbthomas.github.io/ripple"
title = "ripple"
description = "Monorepo change detection: which modules changed for a given git diff"
author = "Charlie Thomas"
default_language = "en"
theme = "devlab-theme"
compile_sass = true
build_search_index = true

[search]
include_title = true
include_description = true
include_content = true

[markdown]
insert_anchor_links = "right"

[markdown.highlighting]
light_theme = "github-light"
dark_theme = "github-dark"

[extra.devlab.brand]
logo_text = "ripple"
footer_text = "ripple"

[extra.devlab.footer]
note = "Monorepo change detection."
links = [
  { name = "GitHub", path = "https://github.com/charlesbthomas/ripple", icon = "github" },
]

[extra.devlab.navigation]
links = [
  { name = "Home", path = "/" },
  { name = "Docs", path = "/docs/", kind = "docs" },
]

[extra.devlab.docs]
section = "docs/_index.md"
path = "/docs/"
get_started_path = "/docs/getting-started/"

[extra.devlab.appearance]
default_mode = "system"
show_toggle = true
